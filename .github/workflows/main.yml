name: Java CI avec Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupère ton code source depuis le dépôt GitHub
      - name: Checkout du code
        uses: actions/checkout@v4

      # 2. Installe l'environnement Java 25 (pour correspondre à ton pom.xml)
      - name: Configuration de Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'oracle'
          cache: maven

      # 3. Compile le projet et crée le JAR via ton pom.xml
      - name: Build avec Maven
        run: mvn -B package

      # 4. Sauvegarde le fichier .jar pour que tu puisses le télécharger
      - name: Telecharger l'executable JAR
        uses: actions/upload-artifact@v4
        with:
          name: mon-projet-gestion
          path: target/*.jar
