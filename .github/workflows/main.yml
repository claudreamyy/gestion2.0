name: Java CI avec Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'oracle'
          cache: maven

      - name: Build avec Maven
        run: mvn -B package

      - name: Telecharger l'executable JAR
        uses: actions/upload-artifact@v4
        with:
          name: gestion-eleves-application
          # On cherche tous les fichiers .jar dans le dossier target
          path: "**/target/*.jar"
