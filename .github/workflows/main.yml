name: Java CI avec Maven

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build avec Maven
        run: mvn -B package

      - name: Telecharger l'executable JAR
        uses: actions/upload-artifact@v4
        with:
          name: mon-projet-gestion
          path: target/*.jar
